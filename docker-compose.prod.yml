services:
  database:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: speckost
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d speckost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://username:password@database:5432/speckost
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
